[project]
name = "cifake-classifier-demo"
version = "0.1.0"
description = "CIFAKE image classifier with a Streamlit demo and training notebook"
readme = "README.md"
requires-python = "==3.12.16"
dependencies = [
    "keras==3.6.0",
    "numpy==1.26.4",
    "pillow==10.4.0",
    "streamlit==1.39.0",
    "tensorflow==2.17.0",
]

[dependency-groups]
notebook = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.6",
    "kagglehub==0.4.3",
    "matplotlib==3.11.2",
    "pandas==2.3.3",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
]
